<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Wiz · 团队日程</title><style>/*__CSS__*/</style></head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i><span>WIZ PLANNER</span></div>
    <div class="brand"><span class="brand-icon">w<span>·</span></span><div><strong>团队日程</strong><small>让每一天，都有条理。</small></div></div>
    <div class="space-label">工作空间 <span>LOCAL</span></div>
    <nav id="navigation"></nav>
    <div class="section-label">我的项目<button data-action="new-project" title="添加项目" aria-label="添加项目">＋</button></div>
    <div id="projects"></div>
    <div class="section-label">团队成员<button data-action="new-member" title="添加成员" aria-label="添加成员">＋</button></div>
    <div id="members"></div>
    <div class="sidebar-bottom"><div class="identity"><label for="my-member">我的身份</label><select id="my-member" aria-label="我的身份"></select></div><div class="local-note"><span class="dot"></span><span id="save-status">本地工作空间</span><button data-action="theme" title="切换外观" aria-label="切换外观">◐</button></div></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb"><button data-action="sidebar" class="icon-button" title="展开或收起侧栏" aria-label="展开或收起侧栏">☷</button><span>我的工作空间</span><span class="slash">/</span><strong id="breadcrumb-title">团队时间轴</strong></div><div class="top-actions"><button data-action="backup" class="subtle">↥ <span>备份与导入</span></button><button data-action="new-task" class="primary">＋ 新建任务</button></div></header>
    <div id="storage-warning" class="storage-warning" hidden></div>
    <section class="page-heading"><div><div class="eyebrow" id="eyebrow">PLAN TOGETHER, MOVE FORWARD</div><h1 id="page-title">团队时间轴<span class="title-dot">.</span></h1><p id="page-description">把计划放在一起，让协作清晰可见。</p></div><div class="heading-right"><div class="avatar-stack" id="avatar-stack"></div><span id="team-count"></span></div></section>
    <section class="stats" id="stats"></section>
    <section class="workspace"><div class="workspace-tools"><div class="segmented" id="view-tabs"></div><div class="filters"><label class="search">⌕ <input id="search" placeholder="搜索任务或成员…" aria-label="搜索任务或成员"></label><select id="priority-filter" aria-label="筛选优先级"><option value="">所有优先级</option><option>P0</option><option>P1</option><option>P2</option></select><select id="status-filter" aria-label="筛选状态"><option value="">所有状态</option><option value="todo">未开始</option><option value="in_progress">进行中</option><option value="review">待验收</option><option value="done">已完成</option></select></div></div><div class="view-toolbar" id="view-toolbar"></div><div class="view-content" id="view-content"></div><footer class="workspace-footer"><span id="footer-info"></span><span><i class="legend-today"></i> 今天 <i class="legend-diamond">◆</i> 里程碑 <span class="desktop-hint">· 点击任务编辑</span></span></footer></section>
    <div class="page-bottom"><span>给专注留出空间。</span><span id="bottom-date"></span></div>
  </main>
</div>
<dialog id="editor"><form id="editor-form"></form></dialog>
<dialog id="backup-dialog"><div class="dialog-head"><div><div class="eyebrow">YOUR DATA, YOUR SPACE</div><h2>本地数据与备份</h2></div><button data-action="close-backup" class="icon-button" aria-label="关闭">×</button></div><p class="help">修改会自动存入当前浏览器。浏览器缓存与磁盘文件是两份数据；清理浏览器、换浏览器或移动 HTML 前，请导出备份。</p><div class="backup-options"><button data-action="save-json"><strong>↓ 保存 JSON 备份</strong><small>完整保存项目、成员、任务与里程碑，可重新导入</small></button><button data-action="save-html"><strong>↓ 导出带数据的 HTML</strong><small>一个文件，双击即用，离线也能继续编辑</small></button><button data-action="import-json"><strong>↥ 从 JSON 恢复</strong><small>校验成功后预览数量，确认后替换当前工作区</small></button><button data-action="legacy-import" id="legacy-import"><strong>↳ 导入原版数据库</strong><small>在 npm 启动的页面中读取旧版数据，原数据库不变</small></button></div><div class="backup-bottom"><button data-action="empty-workspace" class="danger-text">创建空白工作区</button><span>数据仅保留在本机 · 无云端同步</span></div></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message" class="help"></p><div class="form-actions"><button value="cancel">取消</button><button value="confirm" class="primary">确认</button></div></form></dialog>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script id="planner-data" type="application/json">null</script>
<script>/*__APP__*/</script>
</body></html>
