name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run planner:build
      - run: git diff --exit-code -- index.html public/team-planner.html
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
